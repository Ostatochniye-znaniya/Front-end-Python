server {
    listen 80;
    server_name _;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Сначала обрабатываем /csh/api - проксируем на API сервер
    location /csh/api/ {
        # API is optional for a standalone frontend run. Resolve it only when
        # an API request arrives so Nginx can start without the API container.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Дополнительные заголовки для API
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Затем обрабатываем всё остальное, что начинается с /csh/
    location /csh/ {
        # Убираем все редиректы, просто проксируем
        proxy_pass http://nextjs:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Важно: не кэшируем HTML
        proxy_no_cache $http_upgrade;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Для запросов без /csh/ - просто проксируем с добавлением префикса
    location / {
        proxy_pass http://nextjs:3000/csh$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
